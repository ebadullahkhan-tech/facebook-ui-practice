<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook - Log In or Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="badacontainer">
        
        <h1 class="face">facebook</h1>
        <p class="line">Facebook helps you connect and share with the people in your life.</p>

        <div class="chota-container">
            <form>
                <input type="text" placeholder="Email address or phone number" class="kuchbhi">
                <input type="password" placeholder="Password" class="kuchbhi">
                
                <button type="submit" class="login">Log in</button>
                
                <div class="link-wrapper">
                    <a href="#" class="forgot-link">Forgotten password?</a>
                </div>

                <hr class="divider">

                <div class="create-btn-wrapper">
                    <button type="button" class="create-btn">Create new account</button>
                </div>
            </form>
        </div>

        <p class="footer-text">
            <strong>Create a Page</strong> for a celebrity, brand or business.
        </p>

    </div>

</body>
</html>
